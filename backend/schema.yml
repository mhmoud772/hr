components:
  schemas:
    AIQueryRequest:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          description: User's natural language query
        include_context:
          type: boolean
          default: true
          description: Whether to include system snapshot and policies
      required:
      - prompt
    AIResponse:
      type: object
      properties:
        answer:
          type: string
        metadata: {}
        status:
          type: string
      required:
      - answer
      - metadata
      - status
    AdminRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        name:
          type: string
      required:
      - email
      - password
      - username
    Asset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assigned_to_name:
          type: string
          readOnly: true
        assigned_to_code:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        name_en:
          type: string
          maxLength: 255
        serial_number:
          type: string
          maxLength: 255
        category:
          type: string
          maxLength: 255
        category_en:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/AssetStatusEnum'
        assigned_at:
          type: string
