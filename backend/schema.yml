          - create
          - delete
          - update
        description: |-
          * `create` - Create
          * `update` - Update
          * `delete` - Delete
      - in: query
        name: model_name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
