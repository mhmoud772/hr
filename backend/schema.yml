openapi: 3.0.3
info:
  title: HR Companion API
  version: 1.0.0
  description: API documentation for the HR Companion system, covering employees,
    attendance, devices, and more.
paths:
  /api/ai/dashboard-summary/:
    get:
      operationId: ai_dashboard_summary_retrieve
      description: Generates a human-friendly executive summary of the current dashboard
        KPIs.
      summary: AI-generated dashboard summary
      tags:
      - ai
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIResponse'
          description: ''
  /api/ai/policies/:
    get:
      operationId: ai_policies_list
      description: Get a list of all active HR policy documents.
      summary: List active HR policies
      tags:
      - ai
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyDocument'
          description: ''
  /api/ai/query/:
    post:
      operationId: ai_query_create
      description: Ask questions about HR policies or current system status.
      summary: Natural language query for AI Assistant
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIQueryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIQueryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIQueryRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIResponse'
          description: ''
  /api/analytics/snapshot:
    post:
      operationId: analytics_snapshot_create
      tags:
      - analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricSnapshotTriggerRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MetricSnapshotTriggerRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MetricSnapshotTriggerRequestRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSnapshotStatusResponse'
          description: ''
  /api/analytics/trends:
    get:
      operationId: analytics_trends_retrieve
      parameters:
      - in: query
