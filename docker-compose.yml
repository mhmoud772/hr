services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: hr_db
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hr-backend

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: "dev-secret-key"
      FRONTEND_URL: "http://localhost:8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "hr_db"
      POSTGRES_USER: "hr_user"
      POSTGRES_PASSWORD: "hr_password"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_USE_HTTPS: "false"
      DJANGO_USE_X_FORWARDED_PROTO: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hr-backend
      - hr-frontend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8000/api"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hr-frontend

volumes:
  postgres_data:

networks:
  hr-backend:
  hr-frontend:
