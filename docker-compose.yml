services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: hr_db
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hr-backend

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hr-backend

  backend:
    build:
      context: ./backend
    environment:
      DB_ENGINE: "postgres"
      DJANGO_SECRET_KEY: "dev-secret-key-change-me-please-32chars-long"
      FRONTEND_URL: "http://localhost:8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "hr_db"
      POSTGRES_USER: "hr_user"
      POSTGRES_PASSWORD: "hr_password"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      REDIS_CACHE_URL: "redis://redis:6379/2"
      APP_TIME_ZONE: "Asia/Riyadh"
      DEVICE_SYNC_TIME_ZONE: "Asia/Riyadh"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_USE_HTTPS: "false"
      DJANGO_USE_X_FORWARDED_PROTO: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hr-backend
      - hr-frontend

  celery-worker:
    build:
      context: ./backend
    entrypoint: ["celery"]
    command: ["-A", "config", "worker", "--beat", "--loglevel=INFO"]
    environment:
      DB_ENGINE: "postgres"
      DJANGO_SECRET_KEY: "dev-secret-key-change-me-please-32chars-long"
      FRONTEND_URL: "http://localhost:8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "hr_db"
      POSTGRES_USER: "hr_user"
      POSTGRES_PASSWORD: "hr_password"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      REDIS_CACHE_URL: "redis://redis:6379/2"
      APP_TIME_ZONE: "Asia/Riyadh"
      DEVICE_SYNC_TIME_ZONE: "Asia/Riyadh"
      DEVICE_TIME_SYNC_ENABLED: "false"
      DEVICE_TIME_SYNC_INTERVAL_MINUTES: "0"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_USE_HTTPS: "false"
      DJANGO_USE_X_FORWARDED_PROTO: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hr-backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8000/api"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hr-frontend

volumes:
  postgres_data:
  redis_data:

networks:
  hr-backend:
  hr-frontend:
